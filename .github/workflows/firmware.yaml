name: VariKey

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  #schedule:
  #  - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      BuildType:
        description: 'Build type'
        required: true
        default: Debug
        type: choice
        options:
        - Debug
        - Release

env:
  BUILD_TYPE: ${{ inputs.BuildType || 'Release' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        hardware: [VARIKEY, GMCI]
        product: [KEYPAD_DEMO, KEYPAD_10BWDB]
        include:
          - hardware: VARIKEY_15SBLA_PROTO
            product: KEYPAD_15SBLA
          - hardware: VARIKEY_15SBLA_PROTO
            product: KEYPAD_PANEL15
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4.0.0
      with:
        submodules: true

    - name: Declare variables
      shell: bash
      run: |
        echo "git_short=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
        echo "git_branch=$(echo ${GITHUB_REF#refs/heads/})" >> "$GITHUB_ENV"

    - name: Install GNU Arm Embedded Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib libusb-1.0-0-dev

    - name: Test firmware commands on the host
      if: matrix.hardware == 'VARIKEY_15SBLA_PROTO'
      run: |
        cmake -S tests -B build/host-tests
        cmake --build build/host-tests
        ctest --test-dir build/host-tests --output-on-failure

    - name: Test factory provisioning without a device
      if: matrix.hardware == 'VARIKEY_15SBLA_PROTO'
      run: .scripts/test-provision.sh

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/bin -S${{github.workspace}} -DCMAKE_BUILD_TYPE:STRING=${{env.BUILD_TYPE}} -DHARDWARE_PLATFORM:STRING=${{matrix.hardware}} -DFIRMWARE_PRODUCT:STRING=${{matrix.product}}

    - name: Build
      run: cmake --build ${{github.workspace}}/bin --config ${{env.BUILD_TYPE}} -j 6 --

    - name: Check the firmware outputs
      shell: bash
      run: |
        shopt -s nullglob
        elf=(bin/varikey_*.elf)
        uf2=(bin/varikey_*.uf2)
        test "${#elf[@]}" -eq 1
        test -s "${elf[0]}"
        test "${#uf2[@]}" -eq 1
        test -s "${uf2[0]}"
        args=()
        if [[ "${{ matrix.product }}" == KEYPAD_PANEL15 ]]; then args+=(--panel15); fi
        .scripts/test-hid-descriptor.py "${elf[0]}" "${args[@]}"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: varikey-bin-${{matrix.product}}-${{matrix.hardware}}-${{ env.BUILD_TYPE }}-${{ env.git_short }}
        path: |
          ${{github.workspace}}/bin/varikey_*.elf
          ${{github.workspace}}/bin/varikey_*.uf2
        if-no-files-found: error
        retention-days: 2
